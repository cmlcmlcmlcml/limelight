  const sprites = { walk: [], jump: [], logo: null };
  let spritesLoaded = false;
  function loadSprites(cb) {
    let pending = 9;
    function tick() { if (--pending === 0) { spritesLoaded = true; cb(); } }
    for (let i = 1; i <= 4; i++) {
      const wImg = new Image();
      wImg.onload = tick;
      wImg.src = SPRITE_DATA['walk' + i];
      sprites.walk.push(wImg);
      const jImg = new Image();
      jImg.onload = tick;
      jImg.src = SPRITE_DATA['jump' + i];
      sprites.jump.push(jImg);
    }
    const logoImg = new Image();
    logoImg.onload = tick;
    logoImg.src = SPRITE_DATA.logo;
    sprites.logo = logoImg;
  }

  const PALETTE = { 'K': '#1a1a1a', 'W': '#ffffff', '$': '#f0c850' };
  function drawPxSprite(sprite, x, y, scale) {
    for (let row = 0; row < sprite.length; row++) {
      const line = sprite[row];
      for (let col = 0; col < line.length; col++) {
        const ch = line[col];
        if (ch === '.') continue;
        ctx.fillStyle = PALETTE[ch] || '#000';
        ctx.fillRect(Math.floor(x + col * scale), Math.floor(y + row * scale), scale, scale);
      }
    }
  }

        if (line[c] === 'W') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.floor(x + c * 3), Math.floor(y + r * 3), 3, 3);
        }
      }
    }
  }

  const SPRITE_PALM = [
    "................","................","................","................",
    "......GGgg......",".....GGGggg.....","....GGGgggGG....","...GGGGgGGGGG...",
    "..GGGGG.GGGGGG..",".GGGGG...GGGGG..","GGGG.GG.GGG..GG.","GG.GGGGGGGGGG.GG",
    ".gGGGGGgGGGGGGg.","..gGGgGGGGgGGg..","....gg.GG.gg....","........T.......",
    ".......Tt.......",".......Tt.......",".......Tt.......",".......Tt.......",
    ".......Tt.......",".......Tt.......",".......Tt.......",".......Tt.......",
    ".......Tt.......",".......Tt.......",".......TT.......",".......TT.......",
    "......TTTT......",".....TTTTTT....."
  ];
  const PALM_PALETTE = { 'G':'#2f6b3a','g':'#4a8f4f','T':'#5a3818','t':'#7a4f28' };
  function drawPalm(x, y, scale) {
    for (let r = 0; r < SPRITE_PALM.length; r++) {
      const line = SPRITE_PALM[r];
      for (let c = 0; c < line.length; c++) {
        const ch = line[c];
        if (ch === '.') continue;
        ctx.fillStyle = PALM_PALETTE[ch] || '#000';
        ctx.fillRect(Math.floor(x + c * scale), Math.floor(y + r * scale), scale, scale);
      }
    }
  }

  let state = 'menu';
  let score = 0, highScore = 0, frameCount = 0;

  const PLAYER_W = 75;
  const PLAYER_H = 125;
  const player = {
    x: W / 2 - PLAYER_W / 2,
    y: GROUND_Y - PLAYER_H,
    w: PLAYER_W,
    h: PLAYER_H,
    speed: 5,
    facingLeft: false,
    moving: false,
    jumpFrame: -1
  };

  const PLANE_W = 280, PLANE_H = 82;
  const plane = { x: -PLANE_W, y: 25, baseY: 25, w: PLANE_W, h: PLANE_H, speed: 1.8, nextDrop: 80 };

  const BAG_W = 24, BAG_H = 28;
  const bags = [];
  let bagSpeed = 2.2, dropInterval = 110;

  const clouds = [
    { x: 100, y: 50, speed: 0.18 },
    { x: 350, y: 90, speed: 0.12 },
    { x: 600, y: 35, speed: 0.22 },
    { x: 800, y: 70, speed: 0.15 }
  ];

  const PALM_SCALE = 3;
  const PALM_H_PX = SPRITE_PALM.length * PALM_SCALE;
  const palms = [
    { x: 30,     y: GROUND_Y - PALM_H_PX + 6 },
    { x: W - 78, y: GROUND_Y - PALM_H_PX + 6 }
  ];

  const keys = {};
  let touchSide = null;

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (state !== 'playing') startGame();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function getTouchSide(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) < rect.width / 2 ? 'left' : 'right';
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state !== 'playing') { startGame(); return; }
    touchSide = getTouchSide(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (state === 'playing') touchSide = getTouchSide(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); touchSide = null; }, { passive: false });
  canvas.addEventListener('mousedown', () => { if (state !== 'playing') startGame(); });

  function startGame() {
    state = 'playing';
    score = 0;
    bags.length = 0;
    player.x = W / 2 - PLAYER_W / 2;
    player.facingLeft = false;
    player.jumpFrame = -1;
    plane.x = -PLANE_W;
    plane.baseY = 25 + Math.random() * 30;
    plane.y = plane.baseY;
    plane.speed = 1.8;
    plane.nextDrop = 80;
    bagSpeed = 2.2;
    dropInterval = 110;
    frameCount = 0;
  }

  function update() {
    frameCount++;
    if (state === 'playing') {
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = W + 30;
      });
    }
    if (state !== 'playing') return;

    let dx = 0;
    if (keys['arrowleft']  || keys['a'] || touchSide === 'left')  dx -= player.speed;
    if (keys['arrowright'] || keys['d'] || touchSide === 'right') dx += player.speed;
    if (dx < 0) player.facingLeft = true;
    if (dx > 0) player.facingLeft = false;
    player.moving = dx !== 0;
    player.x = Math.max(0, Math.min(W - player.w, player.x + dx));

    if (player.jumpFrame >= 0) {
      player.jumpFrame++;
      if (player.jumpFrame >= 16) player.jumpFrame = -1;
    }

    plane.x += plane.speed;
    if (plane.x > W) {
      plane.x = -plane.w;
      plane.baseY = 25 + Math.random() * 30;
    }
    plane.y = plane.baseY + Math.sin(frameCount * 0.04) * 4;
    plane.nextDrop--;
    if (plane.nextDrop <= 0 && plane.x > 0 && plane.x < W - plane.w) {
      const dropX = plane.x + plane.w / 2 + (Math.random() - 0.5) * 36;
      bags.push({
        x: dropX - BAG_W / 2,
        y: plane.y + plane.h + 14,
        w: BAG_W, h: BAG_H, vy: bagSpeed
      });
      plane.nextDrop = dropInterval + Math.random() * 50;
    }

    const catchTop    = player.y + 60;
    const catchBottom = player.y + 110;
    const catchLeft   = player.x + 18;
    const catchRight  = player.x + player.w - 18;

    for (let i = bags.length - 1; i >= 0; i--) {
      const bag = bags[i];
      bag.y += bag.vy;

      if (bag.y + bag.h >= catchTop &&
          bag.y <= catchBottom &&
          bag.x + bag.w >= catchLeft &&
          bag.x <= catchRight) {
        bags.splice(i, 1);
        score++;
        if (score > highScore) highScore = score;
        player.jumpFrame = 0;
        if (score % 5 === 0) {
          bagSpeed     = Math.min(6,   bagSpeed + 0.35);
          dropInterval = Math.max(35,  dropInterval - 9);
          plane.speed  = Math.min(3.6, plane.speed + 0.15);
        }
        continue;
      }

      if (bag.y > GROUND_Y) {
        state = 'gameover';
        bag.y = GROUND_Y - bag.h;
        break;
      }
    }
  }

  function pad(n) { return String(n).padStart(5, '0'); }

  function drawPlayer() {
    if (!spritesLoaded) return;
    let frame;
    if (state === 'gameover') {
      frame = sprites.walk[1];
    } else if (player.jumpFrame >= 0) {
      const idx = Math.min(3, Math.floor(player.jumpFrame / 4));
      frame = sprites.jump[idx];
    } else if (player.moving) {
      const idx = Math.floor(frameCount / 6) % 4;
      frame = sprites.walk[idx];
    } else {
      frame = sprites.walk[1];
    }

    if (player.facingLeft) {
      ctx.save();
      ctx.translate(player.x + player.w, player.y);
      ctx.scale(-1, 1);
      ctx.drawImage(frame, 0, 0, player.w, player.h);
      ctx.restore();
    } else {
      ctx.drawImage(frame, player.x, player.y, player.w, player.h);
    }
  }

  function drawBlimp(p) {
    const cx = p.x + p.w / 2;
    const cy = p.y + p.h / 2;
    const rx = p.w / 2;
    const ry = p.h / 2;

    // Tail fins (back of blimp = left side, since blimp moves right)
    ctx.fillStyle = '#9098a0';
    ctx.strokeStyle = '#5a6068';
    ctx.lineWidth = 2;
    // Top fin
    ctx.beginPath();
    ctx.moveTo(p.x + 18, cy - 4);
    ctx.lineTo(p.x - 6, p.y - 2);
    ctx.lineTo(p.x + 38, p.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Bottom fin
    ctx.beginPath();
    ctx.moveTo(p.x + 18, cy + 4);
    ctx.lineTo(p.x - 6, p.y + p.h + 2);
    ctx.lineTo(p.x + 38, p.y + p.h - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Envelope (main body)
    ctx.fillStyle = '#eef0f4';
    ctx.strokeStyle = '#5a6068';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Subtle highlight on the upper envelope
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(cx - rx * 0.08, cy - ry * 0.45, rx * 0.7, ry * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gondola underneath the envelope
    const gw = 44, gh = 16;
    const gx = cx - gw / 2;
    const gy = p.y + p.h - 4;
    ctx.fillStyle = '#5a6068';
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = '#3a3f45';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx, gy, gw, gh);
    // Gondola windows
    ctx.fillStyle = '#9adfff';
    ctx.fillRect(gx + 4, gy + 4, 8, 7);
    ctx.fillRect(gx + 16, gy + 4, 8, 7);
    ctx.fillRect(gx + 28, gy + 4, 8, 7);
    // Cables connecting gondola to envelope
    ctx.strokeStyle = '#3a3f45';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(gx + 4, gy);
    ctx.lineTo(gx + 4, p.y + p.h - 2);
    ctx.moveTo(gx + gw - 4, gy);
    ctx.lineTo(gx + gw - 4, p.y + p.h - 2);
    ctx.stroke();

    // Logo on the side of the envelope
    if (sprites.logo) {
      const logoW = p.w * 0.72;
      const logoH = logoW * (49 / 220);
      ctx.drawImage(sprites.logo, cx - logoW / 2, cy - logoH / 2, logoW, logoH);
    }
  }

  function draw() {
    ctx.fillStyle = '#b8e0ed';
    ctx.fillRect(0, 0, W, GROUND_Y);

    ctx.fillStyle = '#d8eef5';
    ctx.fillRect(0, GROUND_Y - 40, W, 40);

    clouds.forEach(c => drawCloud(c.x, c.y));
    palms.forEach(p => drawPalm(p.x, p.y, PALM_SCALE));

    ctx.fillStyle = '#f0d8a5';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    ctx.fillStyle = '#c8a878';
    for (let x = 0; x < W; x += 36) {
      ctx.fillRect(Math.floor(x),      GROUND_Y + 12, 3, 2);
      ctx.fillRect(Math.floor(x) + 16, GROUND_Y + 22, 4, 2);
      ctx.fillRect(Math.floor(x) + 26, GROUND_Y + 34, 2, 2);
      ctx.fillRect(Math.floor(x) +  8, GROUND_Y + 46, 3, 2);
    }

    ctx.fillStyle = '#a88858';
    ctx.fillRect(0, GROUND_Y, W, 2);

    drawBlimp(plane);
    bags.forEach(bag => drawPxSprite(SPRITE_BAG, bag.x, bag.y, 2));
    drawPlayer();

    ctx.fillStyle = '#3a3a3a';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    if (highScore > 0) {
      ctx.fillText('HI ' + pad(highScore) + '  ' + pad(score), W - 18, 16);
    } else {
      ctx.fillText(pad(score), W - 18, 16);
    }

    if (state === 'menu') {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(0, H/2 - 60, W, 120);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 32px "Courier New", monospace';
      ctx.fillText('GRAB THE BAG', W / 2, H / 2 - 20);
      ctx.font = '15px "Courier New", monospace';
      ctx.fillStyle = '#3a3a3a';
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('PRESS SPACE OR TAP TO START', W / 2, H / 2 + 14);
      }
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText('YOU FUMBLED THE BAG!', W / 2, H / 2 - 28);
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#3a3a3a';
      ctx.fillText('SCORE: ' + pad(score) + '    HI: ' + pad(highScore), W / 2, H / 2 + 6);
      ctx.font = '14px "Courier New", monospace';
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('PRESS SPACE OR TAP TO RESTART', W / 2, H / 2 + 36);
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loadSprites(loop);
})();
</script>
</body>
</html>
